<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapTask - AI Screenshot to Task Extraction</title>
    <meta name="description" content="Convert screenshots into structured, actionable items instantly with Gemini Vision." />
    <meta property="og:title" content="SnapTask - AI Screenshot to Task Extraction" />
    <meta property="og:description" content="Convert screenshots into structured, actionable items instantly with Gemini Vision." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Safeguard against "Cannot set property fetch of #<Window> which has only a getter" in sandboxed environments -->
    <script>
      (function () {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch;
            },
            set: function (fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          /* ignore if cannot redefine */
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('snaptask_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
